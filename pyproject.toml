[project]
name = "plast-hike-planner"
version = "0.1.0"
description = "Agent that plans Plast hikes: Obsidian MCP for notes + custom plast-trail MCP server for routes, rules, weather and supplies"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "mcp[cli]>=1.20",
    "langgraph>=1.0",
    "langchain-openai>=1.0",
    "httpx>=0.28",
    "pydantic>=2.11",
    "pyyaml>=6.0",
    "python-dotenv>=1.1",
    # Windows has no system time-zone database: without this ZoneInfo("Europe/Kyiv") fails at import
    "tzdata>=2024.1",
    # the plan pages (plast-web); already pulled in by mcp, declared so a change there cannot break the web
    "starlette>=0.47",
    "uvicorn>=0.35",
]

[project.scripts]
plast-trail = "plast_trail.server:main"
plast-agent = "plast_agent.cli:main"
check-obsidian = "plast_agent.check_obsidian:main"
plast-web = "plast_web.app:main"

[tool.uv]
# cryptography 49+ ships no ready-made wheel for Intel Macs (it would need a Rust toolchain to build)
constraint-dependencies = ["cryptography<49"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plast_trail", "src/plast_agent", "src/plast_web"]
