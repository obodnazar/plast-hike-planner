# Набір для перевірки розуміння запитів: TEST (контрольний).
# Ці приклади НЕ використовуємо для покращень: не розбираємо їхні окремі помилки, не беремо
# в інструкції чи навчання. Дивимось лише на загальні цифри на важливих етапах
# (початкові цифри, після покращень, фінал). Так цифри чесно показують якість на нових запитах.
# Сюди ж додаємо справжні запити знайомих провідників (source: real), коли вони з'являться.
# Правила розмітки: eval/README.md.
