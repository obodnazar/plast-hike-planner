# Правила розмітки: eval/README.md. Поле, якого немає в `expect`, означає «у тексті не сказано»
# (null; для date_flexibility_days 0; для start_time "08:00"; для списків []).
# {any_of: [...]} — кілька прийнятних відповідей, коли текст справді неоднозначний.
